name: Build image

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "docker build -t ghcr.io/process-agent-sandbox/storefront:${TAG} ."
